name: Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run build
        env:
          AUTO_UPDATE_GH_TOKEN: ${{ secrets.AUTO_UPDATE_GH_TOKEN }}

      - name: Upload release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (node -p "require('./package.json').version")
          $tag = "v$version"
          $releaseDir = "release/$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --title "Agentor $tag" --notes "Release Agentor $tag." --latest
          }
          gh release upload $tag `
            "$releaseDir/Agentor-Windows-$version.exe" `
            "$releaseDir/Agentor-Windows-$version.exe.blockmap" `
            "$releaseDir/latest.yml" `
            --repo $env:GITHUB_REPOSITORY `
            --clobber
