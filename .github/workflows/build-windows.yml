name: release-windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (x, x.y, x.y.z). Laisser vide pour incrément patch auto."
        required: false
        default: ""

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Normalize version input
        id: normalize_version
        shell: pwsh
        run: |
          function Normalize-Version([string]$value) {
            $v = $value.Trim()
            if ($v.StartsWith("v")) {
              $v = $v.Substring(1)
            }

            if ($v -match "^\d+\.\d+\.\d+$") {
              return $v
            }
            if ($v -match "^\d+\.\d+$") {
              return "$v.0"
            }
            if ($v -match "^\d+$") {
              return "$v.0.0"
            }

            throw "Invalid version '$value'. Use x, x.y or x.y.z."
          }

          $raw = "${{ inputs.version }}".Trim()
          $event = "${{ github.event_name }}"
          $refType = "${{ github.ref_type }}"
          $refName = "${{ github.ref_name }}"

          if ($event -eq "push" -and $refType -eq "tag" -and $refName.StartsWith("v")) {
            $semver = Normalize-Version $refName
          } elseif ($raw.Length -gt 0) {
            $semver = Normalize-Version $raw
          } else {
            git fetch --tags --force

            $pkgVersion = (node -p "require('./package.json').version").Trim()
            $pkgSemver = Normalize-Version $pkgVersion

            $latestTag = (git tag --list "v*" --sort=-version:refname | Select-Object -First 1)
            $baseSemver = $pkgSemver
            if ($latestTag) {
              $tagSemver = Normalize-Version $latestTag
              if ([version]$tagSemver -gt [version]$baseSemver) {
                $baseSemver = $tagSemver
              }
            }

            $parts = $baseSemver.Split(".")
            $major = [int]$parts[0]
            $minor = [int]$parts[1]
            $patch = [int]$parts[2] + 1
            $semver = "$major.$minor.$patch"
          }

          "semver=$semver" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Ensure tag does not already exist
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: pwsh
        run: |
          $tag = "v${{ steps.normalize_version.outputs.semver }}"
          if (git rev-parse -q --verify "refs/tags/$tag" *> $null) {
            throw "Tag already exists locally: $tag"
          }

          $remoteTag = git ls-remote --exit-code --tags origin "refs/tags/$tag"
          if ($LASTEXITCODE -eq 0 -and $remoteTag) {
            throw "Tag already exists on origin: $tag"
          }

      - name: Set app version
        run: npm version "${{ steps.normalize_version.outputs.semver }}" --no-git-tag-version --allow-same-version

      - name: Build Windows EXE
        run: npm run build:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Validate release files
        shell: pwsh
        run: |
          $version = "${{ steps.normalize_version.outputs.semver }}"
          $releaseDir = "release/$version"

          if (-not (Test-Path $releaseDir)) {
            throw "Release directory not found: $releaseDir"
          }

          $latest = Join-Path $releaseDir "latest.yml"
          if (-not (Test-Path $latest)) {
            throw "Missing $latest"
          }

          $exeFiles = Get-ChildItem -Path $releaseDir -File -Filter "*.exe"
          if ($exeFiles.Count -eq 0) {
            throw "No setup .exe found in $releaseDir"
          }

          $blockmapFiles = Get-ChildItem -Path $releaseDir -File -Filter "*.blockmap"
          if ($blockmapFiles.Count -eq 0) {
            throw "No .blockmap file found in $releaseDir"
          }

      - name: Upload build artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Agentor-Windows-${{ steps.normalize_version.outputs.semver }}
          path: |
            release/${{ steps.normalize_version.outputs.semver }}/latest*.yml
            release/${{ steps.normalize_version.outputs.semver }}/*.exe
            release/${{ steps.normalize_version.outputs.semver }}/*.blockmap

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.normalize_version.outputs.semver }}
          target_commitish: ${{ github.sha }}
          name: Agentor v${{ steps.normalize_version.outputs.semver }}
          generate_release_notes: true
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            release/${{ steps.normalize_version.outputs.semver }}/latest*.yml
            release/${{ steps.normalize_version.outputs.semver }}/*.exe
            release/${{ steps.normalize_version.outputs.semver }}/*.blockmap
