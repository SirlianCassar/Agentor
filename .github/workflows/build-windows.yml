name: release-windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (ex: 1.10.6)"
        required: true
        default: "1.10.6"

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Normalize version input
        id: normalize_version
        shell: pwsh
        run: |
          $raw = "${{ inputs.version }}".Trim()
          if ($raw.StartsWith("v")) {
            $raw = $raw.Substring(1)
          }

          if ($raw -match "^\d+\.\d+\.\d+$") {
            $semver = $raw
          } elseif ($raw -match "^\d+\.\d+$") {
            $semver = "$raw.0"
          } elseif ($raw -match "^\d+$") {
            $semver = "$raw.0.0"
          } else {
            throw "Invalid version '$raw'. Use x, x.y or x.y.z."
          }

          "semver=$semver" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Set app version
        run: npm version "${{ steps.normalize_version.outputs.semver }}" --no-git-tag-version

      - name: Build Windows EXE
        run: npm run build:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Create single ZIP release bundle
        shell: pwsh
        run: |
          $version = "${{ steps.normalize_version.outputs.semver }}"
          $releaseDir = "release/$version"
          $zipPath = "release/TypeFast-Windows-$version.zip"

          $files = Get-ChildItem -Path $releaseDir -File | Where-Object {
            $_.Extension -in @(".exe", ".yml", ".blockmap")
          }

          if ($files.Count -eq 0) {
            throw "No installer files found in $releaseDir"
          }

          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }

          Compress-Archive -Path $files.FullName -DestinationPath $zipPath -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TypeFast-Windows-${{ steps.normalize_version.outputs.semver }}
          path: release/TypeFast-Windows-${{ steps.normalize_version.outputs.semver }}.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.normalize_version.outputs.semver }}
          target_commitish: ${{ github.sha }}
          name: TypeF@st v${{ steps.normalize_version.outputs.semver }}
          generate_release_notes: true
          overwrite_files: true
          files: |
            release/TypeFast-Windows-${{ steps.normalize_version.outputs.semver }}.zip
