name: release-windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (ex: 1.10.6)"
        required: true
        default: "1.10.6"

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set app version
        run: npm version "${{ inputs.version }}" --no-git-tag-version

      - name: Build Windows EXE
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TypeFast-Windows-${{ inputs.version }}
          path: release/${{ inputs.version }}/**

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: TypeF@st v${{ inputs.version }}
          generate_release_notes: true
          files: |
            release/${{ inputs.version }}/**/*.exe
            release/${{ inputs.version }}/**/*.yml
            release/${{ inputs.version }}/**/*.blockmap
